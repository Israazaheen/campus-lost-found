[defaults]
# Path to inventory — override on the command line with -i if needed.
inventory          = inventory.ini
# SSH connection settings
remote_user        = ubuntu
host_key_checking  = False
# Keep output readable during demos
stdout_callback    = yaml
# Retry file location (keep out of repo root)
retry_files_enabled = False
# Reduce connection overhead
pipelining         = True

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False
